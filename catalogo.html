<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pirotecnia Boom · Catálogo</title>
<meta name="description" content="Catálogo de Pirotecnia Boom. Armá tu pedido y envialo por WhatsApp.">
<link rel="icon" href="img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--rojo:#e31e24;--rojo2:#c4161c;--vino:#4a0a0d;--amarillo:#fecc00;--bg:#f7f3f1;--dim:#6f625c;--line:#eadfda}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;background:var(--bg);color:#24130f}
header{background:linear-gradient(90deg,var(--vino),var(--rojo));position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.top{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 14px}
.top .logo{background:#fff;border-radius:10px;padding:3px 8px;display:flex}
.top .logo img{height:46px}
.busq{flex:1;position:relative}.busq input{width:100%;border:none;border-radius:22px;padding:10px 14px 10px 38px;font-size:14px;outline:none}
.busq i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#999}
.tb{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tb:hover{background:rgba(255,255,255,.25)}
.cats{max-width:1240px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}
.cat{background:rgba(255,255,255,.12);color:#fff;border-radius:16px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;border:1px solid transparent}
.cat.on{background:var(--amarillo);color:var(--vino)}
.banda{background:var(--amarillo);color:var(--vino);text-align:center;font-size:13px;font-weight:700;padding:7px 10px}
main{max-width:1240px;margin:0 auto;padding:16px 14px 100px}
.barra{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--dim)}
.barra select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
h2{font-size:17px;color:var(--vino);margin:14px 0 10px;border-left:4px solid var(--rojo);padding-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(74,10,13,.07);display:flex;flex-direction:column;position:relative}
.ph{aspect-ratio:1/1;background:#fff8e0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}.ph img.nofoto{width:60%;height:auto;object-fit:contain;opacity:.35}
.bd{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px}
.bd span{font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;text-transform:uppercase}
.b-of{background:var(--rojo);color:#fff}.b-nu{background:var(--amarillo);color:var(--vino)}.b-ou{background:#1e6fb4;color:#fff}.b-ss{background:#555;color:#fff}
.info{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.nom{font-size:14px;font-weight:700;line-height:1.25}.cod{font-size:11px;color:var(--dim)}
.pr{font-size:18px;font-weight:800;color:var(--rojo)}.pr small{font-size:11px;color:var(--dim);font-weight:600}
.ant{font-size:12px;color:var(--dim);text-decoration:line-through}
.add{margin-top:auto;display:flex;gap:6px;align-items:center}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:none;background:#f6efec;width:28px;height:32px;font-size:16px;cursor:pointer}
.qty input{width:38px;border:none;text-align:center;font-weight:700;height:32px}
.bt{border:none;border-radius:8px;padding:8px 12px;font-weight:800;cursor:pointer;font-size:13px}
.bt-r{background:var(--rojo);color:#fff;flex:1}.bt-r:hover{background:var(--rojo2)}.bt-r:disabled{background:#bbb;cursor:not-allowed}
.bt-w{background:#25d366;color:#fff}.bt-s{background:#f1e9e5;color:var(--vino)}
.fab{position:fixed;right:16px;bottom:16px;background:var(--rojo);color:#fff;border:none;border-radius:30px;padding:14px 18px;font-weight:800;font-size:15px;box-shadow:0 6px 20px rgba(227,30,36,.45);cursor:pointer;z-index:30;display:flex;gap:8px;align-items:center}
.fab .n{background:var(--amarillo);color:var(--vino);border-radius:12px;padding:1px 8px;font-size:13px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:420px;max-width:100%;background:#fff;z-index:50;transform:translateX(105%);transition:transform .2s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{background:var(--vino);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.dh button{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
.db{flex:1;overflow-y:auto;padding:12px 16px}
.it{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.it img{width:48px;height:48px;object-fit:cover;border-radius:8px;background:#fff8e0}
.it .t{flex:1;font-size:13px}.it .t b{display:block}
.df{border-top:1px solid var(--line);padding:12px 16px;background:#fffaf0}
.tot{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}.tot.g{font-size:20px;font-weight:800;color:var(--vino)}
.fi{width:100%;border:1px solid #d9ccc6;border-radius:8px;padding:9px 10px;font-size:14px;margin-top:6px}
label{font-size:12px;font-weight:700;color:var(--vino);display:block;margin-top:8px}
.msg{padding:9px 12px;border-radius:8px;font-size:13px;margin:8px 0}.m-r{background:#fee2e2;color:#b91c1c}.m-g{background:#dcfce7;color:#15803d}.m-w{background:#fff3c4;color:#7a5a00}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:14px}.mod.on{display:flex}
.mod>div{background:#fff;border-radius:14px;max-width:420px;width:100%;padding:20px}
footer{background:var(--vino);color:#f3dcd3;font-size:13px;padding:18px 14px;text-align:center;line-height:1.7}
footer a{color:var(--amarillo)}
.vacio{text-align:center;color:var(--dim);padding:40px}
.sug{font-size:11px;color:var(--dim)}.sug b{color:var(--vino)}
.blt{font-size:12px;color:var(--vino);background:#fff4d6;border-radius:6px;padding:3px 7px;margin-top:4px;display:inline-block}.it .t small{color:var(--dim)}
.mas{border:none;background:none;color:#1e6fb4;font-weight:700;font-size:12px;cursor:pointer;padding:0;text-align:left}
.mas i{margin-right:4px}
.ficha{max-width:640px!important;max-height:92vh;overflow-y:auto;padding:0!important}
.ficha .fh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--vino);color:#fff;font-weight:800;position:sticky;top:0}
.ficha .fh button{background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
.ficha .fb{padding:14px 16px;font-size:14px;line-height:1.55}
.vid{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000;margin-bottom:12px}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ffotos{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.ffotos img{height:150px;border-radius:8px}
@media (max-width:640px){.top{flex-wrap:wrap}.top .logo img{height:38px}.busq{order:3;flex-basis:100%}.grid{grid-template-columns:repeat(2,1fr);gap:8px}.pr{font-size:16px}.tb span{display:none}}

/* Banners del inicio: armados con las fotos de los productos del catálogo */
.hero{position:relative;border-radius:16px;overflow:hidden;margin-bottom:16px;height:270px;background:var(--vino);box-shadow:0 6px 20px rgba(74,10,13,.18)}
.slide{position:absolute;inset:0;display:flex;align-items:center;opacity:0;visibility:hidden;transition:opacity .7s,visibility .7s;
  background:radial-gradient(circle at 78% 22%,rgba(254,204,0,.30),transparent 32%),radial-gradient(circle at 92% 85%,rgba(255,255,255,.12),transparent 26%),linear-gradient(115deg,var(--vino) 0%,#7c0d12 52%,var(--rojo) 100%)}
.slide.on{opacity:1;visibility:visible;z-index:1}
.slide::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(2px 2px at 12% 18%,#fff,transparent),radial-gradient(2px 2px at 34% 70%,var(--amarillo),transparent),radial-gradient(1.5px 1.5px at 56% 30%,#fff,transparent),radial-gradient(2px 2px at 64% 82%,var(--amarillo),transparent),radial-gradient(1.5px 1.5px at 22% 88%,#fff,transparent),radial-gradient(2px 2px at 46% 12%,var(--amarillo),transparent)}
.slide .tx{flex:1;padding:24px 34px;color:#fff;position:relative;z-index:2;min-width:0}
.tx .k{display:inline-block;background:var(--amarillo);color:var(--vino);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:5px}
.tx h3{font-size:34px;font-weight:800;line-height:1.05;margin:10px 0 8px;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.tx p{font-size:15px;opacity:.92;max-width:430px;line-height:1.4}
.tx .cta{margin-top:14px;background:var(--amarillo);color:var(--vino);border:none;border-radius:22px;padding:10px 18px;font-weight:800;font-size:14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;text-decoration:none}
.slide .fo{display:flex;gap:14px;padding-right:30px;align-items:center;position:relative;z-index:2}
.fo img{width:150px;height:150px;object-fit:cover;border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.9);background:#fff}
.fo img:nth-child(2){width:184px;height:184px}
.dots{position:absolute;bottom:12px;left:34px;z-index:3;display:flex;gap:6px}
.dots span{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.45);cursor:pointer;transition:width .3s}
.dots span.on{background:var(--amarillo);width:22px}
/* Animación de los banners */
@keyframes hb-sube{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes hb-pop{0%{opacity:0;transform:scale(.6) rotate(-6deg)}70%{opacity:1;transform:scale(1.06) rotate(1deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes hb-flota{0%,100%{translate:0 0}50%{translate:0 -8px}}
@keyframes hb-chispas{0%,100%{opacity:.25}50%{opacity:.8}}
@keyframes hb-brillo{from{transform:translateX(-120%) skewX(-20deg)}to{transform:translateX(260%) skewX(-20deg)}}
.slide.on::before{animation:hb-chispas 2.4s ease-in-out infinite}
.slide.on .tx>*{animation:hb-sube .6s ease-out both}
.slide.on .tx h3{animation-delay:.12s}.slide.on .tx p{animation-delay:.24s}.slide.on .tx .cta{animation-delay:.36s}
.slide.on .fo img{animation:hb-pop .7s cubic-bezier(.2,.9,.3,1.2) both,hb-flota 3.2s ease-in-out .9s infinite}
.slide.on .fo img:nth-child(2){animation-delay:.15s,1.05s}.slide.on .fo img:nth-child(3){animation-delay:.3s,1.2s}
.tx .cta{position:relative;overflow:hidden}
.tx .cta::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:hb-brillo 2.8s ease-in-out 1s infinite}
@media (prefers-reduced-motion:reduce){.slide,.slide::before,.slide .tx>*,.slide .fo img,.tx .cta::after{animation:none!important;transition:none!important}}
@media (max-width:640px){.hero{height:330px}.slide{flex-direction:column;justify-content:center;align-items:stretch}.slide .tx{padding:18px 18px 0;flex:none}.tx h3{font-size:24px}.tx p{font-size:13px}
  .slide .fo{padding:14px 18px 34px;justify-content:center;gap:10px}.fo img{width:86px;height:86px}.fo img:nth-child(2){width:100px;height:100px}.dots{left:18px}}
/* Pestañas Mayorista / Minorista */
.tabs{max-width:1240px;margin:0 auto;display:flex;gap:6px;padding:2px 14px 8px}
.tabs button{flex:0 0 auto;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:7px 16px;font-weight:800;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tabs button.on{background:#fff;color:var(--vino);border-color:#fff}
@media (max-width:640px){.tabs button{flex:1;justify-content:center}}
</style>
</head>
<body>
<header>
  <div class="top">
    <a class="logo" href="catalogo.html"><img src="img/logo.png" alt="Pirotecnia Boom"></a>
    <div class="busq"><i class="fas fa-search"></i><input id="q" placeholder="Buscar productos…" autocomplete="off"></div>
    <button class="tb" id="b-xls" title="Descargar lista de precios" style="display:none"><i class="fas fa-file-excel"></i><span>Lista</span></button>
  </div>
  <div class="tabs" id="tabs"><button data-l="MAYORISTA"><i class="fas fa-store"></i> Mayorista</button><button data-l="MINORISTA"><i class="fas fa-tag"></i> Minorista</button></div>
  <div class="cats" id="cats"></div>
</header>
<div class="banda" id="banda"></div>
<main><div class="hero" id="hero" style="display:none"></div><div class="barra"><span id="cuenta"></span><select id="orden"><option value="cat">Ordenar por categoría</option><option value="menor">Menor precio</option><option value="mayor">Mayor precio</option><option value="nombre">Nombre</option></select></div><div id="lista"><div class="vacio">Cargando productos…</div></div></main>
<footer id="pie"></footer>
<button class="fab" id="fab"><i class="fas fa-cart-shopping"></i> Mi pedido <span class="n" id="fab-n">0</span></button>
<div class="ov" id="ov"></div>
<aside class="drawer" id="dr">
  <div class="dh"><span><i class="fas fa-cart-shopping"></i> Mi pedido</span><button id="dr-x">&times;</button></div>
  <div class="db" id="dr-b"></div>
  <div class="df" id="dr-f"></div>
</aside>
<div class="mod" id="mod-fi"><div class="ficha" id="fi"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const sb = window.supabase.createClient(LOCAL ? location.origin : 'https://ounzsqhxzdluqkcszkes.supabase.co', 'sb_publishable_g5SGDg6taIq-O8-skchu0w_Zk1Ze1_W', { auth: { persistSession: true, storageKey: 'pb_tienda' } });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const fmt = n => '$ ' + nf.format(Number(n || 0));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
let PROD = [], T = {}, CAT = '', CARRO = {};
try { CARRO = JSON.parse(localStorage.getItem('pb_carro') || '{}'); } catch (e) { CARRO = {}; }
// Lista que se está viendo: el catálogo abre siempre en Mayorista (sin usuario)
let LISTA = 'MAYORISTA';
const esMin = () => LISTA === 'MINORISTA';
const minimo = () => Number(esMin() ? T.minimo_minorista : T.minimo_mayorista) || 0;
// Mayorista: se vende por bulto cerrado si el producto tiene "unidades por bulto"; Minorista: por unidad. El carrito guarda siempre unidades.
const bu = p => !esMin() && p && Number(p.bulto) > 1 ? Number(p.bulto) : 1;
const enBultos = id => { const p = PROD.find(x => x.producto_id == id); const b = bu(p); return Math.round((CARRO[id] || 0) / b); };
function ajustarBultos() { for (const id of Object.keys(CARRO)) { const b = bu(PROD.find(x => x.producto_id == id)); if (b > 1 && CARRO[id] % b) CARRO[id] = Math.ceil(CARRO[id] / b) * b; } }
const guardar = () => { try { localStorage.setItem('pb_carro', JSON.stringify(CARRO)); } catch (e) { } };

async function cargar() {
  const [{ data: t }, { data: p, error }, { data: ex }, { data: dsp }] = await Promise.all([sb.rpc('datos_tienda'), sb.rpc('catalogo_lista', { p_codigo: LISTA }), sb.rpc('catalogo_detalle'), sb.rpc('catalogo_display')]);
  if (error) { $('lista').innerHTML = '<div class="vacio">No pudimos cargar el catálogo. Probá de nuevo en un rato.</div>'; return; }
  T = t || {}; PROD = p || [];
  T.descuentos = (T.descuentos_listas || {})[LISTA] || []; // descuentos por monto de la lista que se ve
  // Precios siempre finales (IVA incluido), también para mayoristas: no se muestra el IVA en ningún lado
  const r2f = n => Math.round(Number(n) * 100) / 100;
  PROD.forEach(x => { if (x.muestra_iva_aparte) { const k = 1 + Number(x.iva_pct) / 100; x.precio = r2f(Number(x.precio) * k); if (x.precio_anterior) x.precio_anterior = r2f(Number(x.precio_anterior) * k); x.muestra_iva_aparte = false; } });
  const D = new Map((dsp || []).map(x => [x.producto_id, x.display])); PROD.forEach(q => { q.display = D.get(q.producto_id) || null; });
  const X = new Map((ex || []).map(x => [x.producto_id, x])); PROD.forEach(q => { const x = X.get(q.producto_id); if (x) { q.video_url = x.video_url; q.info_adicional = x.info_adicional; } });
  heroArmar();
  for (const k of Object.keys(CARRO)) if (!PROD.find(x => x.producto_id == k)) delete CARRO[k];
  ajustarBultos(); guardar();
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.l === LISTA));
  $('b-xls').style.display = esMin() ? 'none' : '';
  $('banda').innerHTML = (esMin() ? '<i class="fas fa-tag"></i> Precios minoristas · ' : '<i class="fas fa-store"></i> Precios mayoristas · ') + (minimo() ? `Compra mínima ${fmt(minimo())} · ` : '') + esc(T.leyenda || '') + (T.descuentos && T.descuentos.length ? ' · ' + T.descuentos.map(d => `${nf.format(d.porcentaje)}% OFF desde ${fmt(d.desde)}`).join(' · ') : '');
  const cats = [...new Map(PROD.sort((a, b) => a.categoria_orden - b.categoria_orden || a.categoria.localeCompare(b.categoria)).map(x => [x.categoria, 1])).keys()];
  $('cats').innerHTML = `<span class="cat ${!CAT ? 'on' : ''}" data-c="">Todo</span>` + (PROD.some(x => x.es_oferta) ? '<span class="cat" data-c="__of">🔥 Ofertas</span>' : '') + cats.map(c => `<span class="cat ${CAT === c ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</span>`).join('');
  document.querySelectorAll('.cat').forEach(c => c.onclick = () => { CAT = c.dataset.c; document.querySelectorAll('.cat').forEach(x => x.classList.toggle('on', x === c)); pintar(); });
  $('pie').innerHTML = `<b>${esc(T.nombre)}</b>${T.direccion ? ' · ' + esc(T.direccion) : ''}${T.horarios ? '<br>' + esc(T.horarios) : ''}${T.whatsapp ? `<br>WhatsApp: <a href="https://wa.me/${String(T.whatsapp).replace(/\D/g, '')}" target="_blank">${esc(T.whatsapp)}</a>` : ''}${T.instagram ? ` · <a href="https://instagram.com/${esc(String(T.instagram).replace('@', ''))}" target="_blank">Instagram</a>` : ''}<br><a href="como-pedir.html">¿Cómo hago mi pedido?</a><br><small>Venta exclusiva a mayores de 18 años. Precios sujetos a stock.</small>`;
  pintar(); pintarCarro();
}
function foto(p) { return p.fotos && p.fotos[0] ? `<img src="${esc(p.fotos[0])}" alt="${esc(p.nombre)}" loading="lazy">` : '<img class="nofoto" src="img/logo.png" alt="">'; }
function pintar() {
  const q = norm($('q').value); const o = $('orden').value;
  let l = PROD.filter(p => (!CAT || (CAT === '__of' ? p.es_oferta : p.categoria === CAT)) && (!q || norm(p.nombre + ' ' + p.codigo + ' ' + p.categoria + ' ' + (p.descripcion || '')).includes(q)));
  if (o === 'menor') l.sort((a, b) => a.precio - b.precio); else if (o === 'mayor') l.sort((a, b) => b.precio - a.precio); else if (o === 'nombre') l.sort((a, b) => a.nombre.localeCompare(b.nombre));
  else l.sort((a, b) => a.categoria_orden - b.categoria_orden || a.categoria.localeCompare(b.categoria) || (b.destacado - a.destacado) || a.nombre.localeCompare(b.nombre));
  $('hero').style.display = !CAT && !q && $('hero').innerHTML ? '' : 'none';
  $('cuenta').textContent = l.length + ' productos';
  if (!l.length) { $('lista').innerHTML = '<div class="vacio">No encontramos productos con esa búsqueda.</div>'; return; }

$('lista').onclick = e => {

function toastFab() { $('fab').animate([{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { duration: 300 }); }
function totales() {
  let neto = 0, fin = 0;
  for (const [id, q] of Object.entries(CARRO)) { const p = PROD.find(x => x.producto_id == id); if (!p) continue; neto += q * Number(p.precio_neto); fin += q * Number(p.precio_neto) * (1 + Number(p.iva_pct) / 100); }

function pintarCarro() {

    <button class="bt bt-r" style="width:100%;margin-top:12px;padding:13px" id="p-ok"><i class="fab fa-whatsapp"></i> Enviar pedido</button><div style="font-size:11px;color:var(--dim);margin-top:6px">El precio queda reservado por ${T.plazo_horas || 48} h hasta que lo confirmemos por WhatsApp. Envío y forma de pago se coordinan por WhatsApp.</div>`;
  if (its) { $('p-ok').onclick = enviar; if (t.total < minimo()) $('p-ok').disabled = true; }

function cambiar(id, d) { const n = (CARRO[id] || 0) + d * bu(PROD.find(x => x.producto_id == id)); if (n <= 0) delete CARRO[id]; else CARRO[id] = n; guardar(); pintarCarro(); pintar(); }
function fijar(id, v) { const n = Math.floor(Number(v) || 0) * bu(PROD.find(x => x.producto_id == id)); if (n <= 0) delete CARRO[id]; else CARRO[id] = n; guardar(); pintarCarro(); }
async function enviar() {
  const nom = $('p-n').value.trim(), cel = $('p-c').value.trim(), dni = $('p-d').value.replace(/\D/g, ''); const err = $('dr-err');
  if (!nom || !cel || !dni) { err.innerHTML = '<div class="msg m-r">Completá nombre, celular y DNI.</div>'; return; }

{ let x0 = null; $('hero').addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
