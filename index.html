<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Pirotecnia Boom · Gestión (prueba)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: barra superior fija con estado de caja + pestañas por área; cada área es una hoja de trabajo con formularios a la izquierda y listados a la derecha */
:root{
  --bg:#f3f4f8; --panel:#ffffff; --ink:#15203a; --muted:#5c6680; --line:#dfe3ec; --soft:#eef1f7;
  --accent:#d9480f; --accent-ink:#ffffff; --spark:#b7791f; --ok:#1f7a4d; --ok-bg:#e3f4ea; --bad:#b42318; --bad-bg:#fde8e6; --warn:#8a5a00; --warn-bg:#fff3d6;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1424; --panel:#141d31; --ink:#e7ebf5; --muted:#9aa5bf; --line:#26314a; --soft:#1a2440;
  --accent:#ff7a3d; --accent-ink:#1a0d05; --spark:#e6b54a; --ok:#5fd39a; --ok-bg:#12321f; --bad:#ff8a7a; --bad-bg:#3a1714; --warn:#f2c35a; --warn-bg:#352a0e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1424; --panel:#141d31; --ink:#e7ebf5; --muted:#9aa5bf; --line:#26314a; --soft:#1a2440;
  --accent:#ff7a3d; --accent-ink:#1a0d05; --spark:#e6b54a; --ok:#5fd39a; --ok-bg:#12321f; --bad:#ff8a7a; --bad-bg:#3a1714; --warn:#f2c35a; --warn-bg:#352a0e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:baseline;gap:8px}
.brand b{color:var(--accent)}
.brand small{font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;font:600 13px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:600 15px var(--display);letter-spacing:.04em;text-transform:uppercase;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.note{background:var(--warn-bg);color:var(--warn);font-size:13px;padding:6px 0}
main{padding-block:18px 60px}
h2{font-family:var(--display);font-size:26px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
h3{font-family:var(--display);font-size:18px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em}
.lead{color:var(--muted);margin:0 0 16px;max-width:70ch}
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
.grid.even{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.hl{border-color:var(--accent)}
form{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row > *{flex:1 1 120px;min-width:0}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
label.chk{flex-direction:row;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:500}
input,select,textarea{font:500 15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 9px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.b{font:600 15px var(--body);border-radius:6px;padding:9px 14px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer}
button.b.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.b.s{padding:5px 9px;font-size:13px}
button.b.d{color:var(--bad)}
button.b:disabled{opacity:.55;cursor:progress}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr.sel td{background:var(--soft)}
.muted{color:var(--muted)} .small{font-size:13px}
.tot{display:grid;grid-template-columns:1fr auto;gap:2px 16px;font-variant-numeric:tabular-nums}
.tot .big{font-family:var(--display);font-size:30px;font-weight:700;color:var(--accent)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--soft);color:var(--muted)}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.warn{background:var(--warn-bg);color:var(--warn)}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;padding:8px;border:1px dashed var(--line);border-radius:6px}
.line > *{flex:1 1 110px;min-width:0}
.line > .x{flex:0 0 auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;max-width:min(680px,calc(100vw - 32px));padding:12px 16px;border-radius:8px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)} .toast.err{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}
.inl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.inl input,.inl select{width:auto;flex:1 1 140px}
.gate{max-width:640px;margin:60px auto}
@media (prefers-reduced-motion:no-preference){button.b{transition:filter .12s} button.b:hover{filter:brightness(1.06)}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <div class="brand">Pirotecnia <b>Boom</b> <small>Gestión · pruebas</small></div>
    <div class="grow"></div>
    <span id="cajaPill" class="pill warn" hidden><i></i>Caja…</span>
    <span id="usr" class="inl" hidden><span id="usrNom" class="small muted"></span><button class="b s" id="salir" type="button">Salir</button></span>
  </div>
  <div class="note"><div class="wrap">Versión de PRUEBA. Lo que se cargue acá queda en la base de prueba, no en la real.</div></div>
  <div class="wrap"><nav class="tabs" id="tabs" role="tablist"></nav></div>
</header>

<main class="wrap" id="main">
  <div class="gate card" id="gate">
    <h2>Ingresar</h2>
    <p class="lead">Sistema de gestión de Pirotecnia Boom.</p>
    <form id="fLogin" autocomplete="on">
      <label>Usuario<input id="lUsr" name="username" autocomplete="username" required autocapitalize="none" spellcheck="false"></label>
      <label>Contraseña<input id="lPass" name="password" type="password" autocomplete="current-password" required></label>
      <p id="loginMsg" class="small" style="color:var(--bad);margin:0" hidden></p>
      <button class="b p" type="submit">Ingresar</button>
    </form>
  </div>
  <section id="view" hidden></section>
</main>
<div id="toast" class="toast" hidden role="status"></div>

<script>

"use strict";
const SB_URL = "https://ounzsqhxzdluqkcszkes.supabase.co";
const SB_KEY = "sb_publishable_g5SGDg6taIq-O8-skchu0w_Zk1Ze1_W";
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
let M = null, TAB = "caja", USUARIO = null;
try { const t = localStorage.getItem("pb_tab"); if (t) TAB = t; } catch (e) {}

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => (n === null || n === undefined || n === "") ? "—" : "$ " + Number(n).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const qty = n => Number(n || 0).toLocaleString("es-AR", { maximumFractionDigits: 3 });
const fdate = d => d ? new Date(d.length === 10 ? d + "T12:00:00" : d).toLocaleDateString("es-AR") : "—";
const fdt = d => d ? new Date(d).toLocaleString("es-AR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
const hoy = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
function lit(s) { let t = "q" + Math.random().toString(36).slice(2, 8); while (String(s).includes("$" + t + "$")) t += "x"; return "$" + t + "$" + s + "$" + t + "$"; }
const T = s => (s === null || s === undefined || s === "") ? "null" : lit(String(s));
const J = o => lit(JSON.stringify(o)) + "::jsonb";
function N(v, campo = "importe") { const n = Number(String(v).replace(",", ".")); if (v === "" || v === null || !Number.isFinite(n)) throw new Error("Revisá el campo " + campo + ": tiene que ser un número."); return String(n); }
const num = v => { const n = Number(String(v ?? "").replace(",", ".")); return Number.isFinite(n) ? n : null; };
const es_dueno = () => !!(M && M.es_dueno);

let toastT;
function toast(msg, kind = "ok") { const t = $("#toast"); t.textContent = msg; t.className = "toast " + kind; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, kind === "err" ? 9000 : 4500); }

function errMsg(e) {
  const t = (e && (e.message || e.error_description || e.msg)) || "";
  if (/Failed to fetch|NetworkError|Load failed/i.test(t)) return "Sin conexión con el servidor. Revisá internet y probá de nuevo.";
  if (/JWT expired|invalid JWT|not authenticated/i.test(t)) return "La sesión venció. Volvé a ingresar.";
  if (/permission denied|row-level security/i.test(t)) return "Tu usuario no tiene permiso para esto.";
  return t || "No se pudo completar la operación.";
}

/* Llama a una función de la base. Los permisos los aplica la base según el usuario que ingresó. */
async function rpc(fn, args, comoPublico) {
  const cli = comoPublico ? pub : sb;
  const { data, error } = await cli.rpc(fn, args || {});
  if (error) throw error;
  return data;
}
async function tabla(q) { const { data, error } = await q; if (error) throw error; return data; }
const pub = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false, storageKey: "pb_publico" } });

async function run(btn, fn) {
  if (btn) btn.disabled = true;
  try { await fn(); } catch (e) { toast(errMsg(e), "err"); console.log(e); }
  finally { if (btn) btn.disabled = false; }
}
function onForm(form, fn) { form.addEventListener("submit", ev => { ev.preventDefault(); run(form.querySelector("button[type=submit]"), () => fn(new FormData(form), form)); }); }
const opts = (arr, val, lab, sel, vacio) => (vacio ? '<option value="">' + esc(vacio) + "</option>" : "") + arr.map(o => '<option value="' + esc(o[val]) + '"' + (String(o[val]) === String(sel) ? " selected" : "") + ">" + esc(typeof lab === "function" ? lab(o) : o[lab]) + "</option>").join("");
const tag = (txt, k = "") => '<span class="tag ' + k + '">' + esc(txt) + "</span>";
const ESTADO_K = { cartera: "ok", depositado: "warn", acreditado: "ok", endosado: "", rechazado: "bad", emitido: "warn", debitado: "", anulado: "bad", anulada: "bad", abierto: "warn", confirmado: "ok", vencido: "bad", cancelado: "bad", registrado: "ok", activo: "ok", inactivo: "bad" };

/* ---------- datos compartidos ---------- */
const D = {};
async function cargar(...q) {
  const map = { productos: "panel_productos", clientes: "panel_clientes", proveedores: "panel_proveedores", cuentas: "panel_cuentas", cheques: "panel_cheques" };
  for (const k of q) D[k] = await rpc(map[k]);
}
async function refrescarCaja() {
  try {
    const c = await rpc("panel_caja"); D.caja = c;
    const p = $("#cajaPill");
    if (c && c.abierta) { const ef = (c.resumen || []).find(r => r.medio_pago_id === 1); p.className = "pill ok"; p.innerHTML = "<i></i>Caja abierta · efectivo " + money(ef ? ef.saldo : 0); }
    else { p.className = "pill bad"; p.innerHTML = "<i></i>Caja cerrada"; }
  } catch (e) { $("#cajaPill").className = "pill warn"; $("#cajaPill").innerHTML = "<i></i>Caja: sin dato"; }
}

/* ---------- componente: medios de pago ---------- */
function pagosUI(box, modo, total) {
  const medios = (M.medios || []).filter(m => modo === "proveedor" ? m.id < 8 && m.tipo !== "tarjeta_credito" : m.id < 8);
  box.innerHTML = '<div class="lines"></div><button type="button" class="b s" data-add>+ Agregar otro medio</button>';
  const lines = $(".lines", box);
  function addLine(pre = {}) {
    const d = document.createElement("div"); d.className = "line";
    d.innerHTML = '<label>Medio<select data-k="medio">' + opts(medios, "id", "nombre", pre.medio || 1) + '</select></label>' +
      '<label>Importe<input data-k="importe" inputmode="decimal" value="' + esc(pre.importe ?? "") + '"></label><div class="extra" style="display:contents"></div>' +
      '<button type="button" class="b s d x" title="Quitar">✕</button>';
    lines.appendChild(d);
    const extra = $(".extra", d);
    const paint = () => {
      const m = medios.find(x => String(x.id) === $("[data-k=medio]", d).value) || {};
      let h = "";
      const ctas = (D.cuentas || []).filter(c => c.estado === "activa");
      if (m.tipo === "cheque" && modo === "cliente") h = '<label>N° cheque<input data-k="ch_numero"></label><label>Banco<input data-k="ch_banco"></label><label>Librador<input data-k="ch_librador"></label><label>CUIT librador<input data-k="ch_cuit"></label><label>Fecha de pago<input type="date" data-k="ch_fecha" value="' + hoy() + '"></label><label class="chk"><input type="checkbox" data-k="ch_echeq"> E-cheq</label>';
      else if (m.tipo === "cheque") {
        const cart = (D.cheques || []).filter(c => c.tipo === "tercero" && c.estado === "cartera");
        h = '<label>Cheque<select data-k="ch_cual"><option value="propio">Cheque propio nuevo</option>' + cart.map(c => '<option value="' + c.id + '">De cartera: ' + esc(c.banco + " " + c.numero + " · " + money(c.importe)) + "</option>").join("") + "</select></label>" +
          '<label>N° (propio)<input data-k="cp_numero"></label><label>Banco (propio)<input data-k="cp_banco"></label><label>Fecha de pago<input type="date" data-k="cp_fecha" value="' + hoy() + '"></label><label>Cuenta<select data-k="cuenta">' + opts(ctas, "id", "nombre", "", "Elegí cuenta") + "</select></label>";
      }
      else if (m.tipo === "tarjeta_credito") h = '<label>Cuotas<input data-k="cuotas" inputmode="numeric" value="1"></label>';
      if (m.tipo && !["efectivo", "cheque"].includes(m.tipo)) h += '<label>Cuenta' + (modo === "proveedor" ? "" : " (opcional)") + '<select data-k="cuenta">' + opts(ctas, "id", "nombre", "", modo === "proveedor" ? "Elegí cuenta" : "Sin cuenta") + "</select></label><label>Referencia<input data-k=\"ref\"></label>";
      extra.innerHTML = h;
    };
    $("[data-k=medio]", d).addEventListener("change", paint); paint();
    $(".x", d).addEventListener("click", () => d.remove());
  }
  $("[data-add]", box).addEventListener("click", () => addLine({}));
  addLine({ medio: 1, importe: total ?? "" });
  return {
    setTotal(t) { const ls = $$(".line", lines); if (ls.length === 1) $("[data-k=importe]", ls[0]).value = t; },
    reset(t) { lines.innerHTML = ""; addLine({ medio: 1, importe: t ?? "" }); },
    get() {
      return $$(".line", lines).map(d => {
        const g = k => { const el = $("[data-k=" + k + "]", d); return el ? (el.type === "checkbox" ? el.checked : el.value) : undefined; };
        const medio = Number(g("medio")); const m = medios.find(x => x.id === medio) || {};
        const o = { medio_pago_id: medio, importe: Number(N(g("importe"))) };
        if (g("cuenta")) o.cuenta_id = Number(g("cuenta"));
        if (g("ref")) o.referencia = g("ref");
        if (g("cuotas")) o.cuotas = Number(g("cuotas"));
        if (m.tipo === "cheque" && modo === "cliente") o.cheque = { numero: g("ch_numero"), banco: g("ch_banco"), librador: g("ch_librador"), cuit_librador: g("ch_cuit") || null, fecha_emision: hoy(), fecha_pago: g("ch_fecha"), echeq: g("ch_echeq") };
        if (m.tipo === "cheque" && modo === "proveedor") {
          if (g("ch_cual") && g("ch_cual") !== "propio") { o.cheque_id = Number(g("ch_cual")); delete o.cuenta_id; }
          else o.cheque_propio = { numero: g("cp_numero"), banco: g("cp_banco"), fecha_pago: g("cp_fecha"), cuenta_id: o.cuenta_id || null };
        }
        return o;
      });
    }
  };
}

/* ---------- componente: renglones de productos ---------- */
function itemsUI(box, campos) {
  box.innerHTML = '<div class="lines"></div><button type="button" class="b s" data-add>+ Agregar producto</button>';
  const lines = $(".lines", box);
  const prods = (D.productos || []).filter(p => p.estado === "activo");
  function add() {
    const d = document.createElement("div"); d.className = "line";
    d.innerHTML = '<label style="flex:3 1 220px">Producto<select data-k="producto">' + opts(prods, "id", p => p.codigo + " · " + p.nombre, "", "Elegí producto") + "</select></label>" +
      campos.map(c => '<label>' + esc(c.label) + '<input data-k="' + c.k + '" inputmode="decimal" placeholder="' + esc(c.ph || "") + '"' + (c.type ? ' type="' + c.type + '"' : "") + "></label>").join("") +
      '<button type="button" class="b s d x" title="Quitar">✕</button>';
    lines.appendChild(d); $(".x", d).addEventListener("click", () => d.remove());
  }
  $("[data-add]", box).addEventListener("click", add); add();
  return { get() { return $$(".line", lines).filter(d => $("[data-k=producto]", d).value).map(d => { const o = { producto_id: Number($("[data-k=producto]", d).value) }; campos.forEach(c => { const v = $("[data-k=" + c.k + "]", d).value; if (v !== "") o[c.k] = c.type === "text" || c.type === "date" ? v : Number(N(v, c.label)); }); return o; }); } };
}

/* ---------- pestañas ---------- */
const TABS = [
  { id: "caja", t: "Caja" }, { id: "vender", t: "Vender" }, { id: "pedidos", t: "Pedidos web" }, { id: "clientes", t: "Clientes" },
  { id: "productos", t: "Productos y stock" }, { id: "compras", t: "Compras", dueno: true }, { id: "gastos", t: "Gastos" },
  { id: "cheques", t: "Cheques" }, { id: "bancos", t: "Bancos", dueno: true } ];
function pintarTabs() {
  const vis = TABS.filter(t => !t.dueno || es_dueno());
  if (!vis.find(t => t.id === TAB)) TAB = "caja";
  $("#tabs").innerHTML = vis.map(t => '<button role="tab" data-tab="' + t.id + '" aria-selected="' + (t.id === TAB) + '">' + esc(t.t) + "</button>").join("");

VISTAS.cheques = async v => {
  await cargar("cheques", "cuentas"); const d = es_dueno();
  const bancos = D.cuentas.filter(c => c.tipo === "banco" && c.estado === "activa");
  const tot = D.cheques.filter(c => c.tipo === "tercero" && c.estado === "cartera").reduce((a, c) => a + Number(c.importe), 0);
  v.innerHTML = '<h2>Cheques</h2><p class="lead">Cartera de cheques recibidos y cheques propios emitidos. En cartera hay <b>' + money(tot) + "</b>." + (d ? "" : " Las operaciones con cheques las hace el dueño.") + '</p><div class="card"><div class="tw"><table><thead><tr><th>Cheque</th><th>De / para</th><th>Pago</th><th class="n">Importe</th><th>Estado</th>' + (d ? "<th>Acción</th>" : "") + "</tr></thead><tbody>" +
    (D.cheques.length ? D.cheques.map(c => { let a = "";
      if (d) {
        if (c.tipo === "tercero" && c.estado === "cartera") a = '<div class="inl"><select data-cta="' + c.id + '">' + opts(bancos, "id", "nombre", "", "Banco") + '</select><button class="b s" data-dep="' + c.id + '">Depositar</button></div>';
        if (c.estado === "depositado") a = '<button class="b s p" data-acr="' + c.id + '">Acreditado</button>';
        if (c.estado === "emitido") a = '<button class="b s" data-deb="' + c.id + '">Debitado</button>';
        if (["cartera", "depositado", "acreditado", "endosado", "emitido"].includes(c.estado)) a += '<div class="inl" style="margin-top:4px"><input data-mot="' + c.id + '" placeholder="Motivo rechazo" style="max-width:130px">' + (c.tipo === "tercero" ? '<input data-gas="' + c.id + '" placeholder="Gastos banco" style="max-width:100px" inputmode="decimal">' : "") + '<button class="b s d" data-rech="' + c.id + '">Rechazado</button></div>';
      }
      return "<tr><td>" + tag(c.tipo === "propio" ? "propio" : "tercero") + " " + esc(c.banco + " N° " + c.numero) + '<div class="muted small">' + esc(c.librador) + "</div></td><td>" + esc(c.cliente || c.proveedor || "—") + "</td><td>" + fdate(c.fecha_pago) + '</td><td class="n">' + money(c.importe) + "</td><td>" + tag(c.estado, ESTADO_K[c.estado]) + (c.cuenta ? '<div class="muted small">' + esc(c.cuenta) + "</div>" : "") + "</td>" + (d ? "<td>" + a + "</td>" : "") + "</tr>"; }).join("") : '<tr><td colspan="6"><div class="empty">No hay cheques. Entran al cobrar con cheque.</div></td></tr>') + "</tbody></table></div></div>";
  $$("[data-dep]").forEach(b => b.onclick = () => run(b, async () => { const id = b.dataset.dep; const c = $("[data-cta=\"" + id + "\"]").value; if (!c) throw new Error("Elegí el banco."); await rpc("depositar_cheque", { p_cheque: Number(id), p_cuenta: Number(c) }); toast("Cheque depositado."); abrir(); }));
  $$("[data-acr]").forEach(b => b.onclick = () => run(b, async () => { await rpc("acreditar_cheque", { p_cheque: Number(b.dataset.acr) }); toast("Cheque acreditado en el banco."); abrir(); }));
  $$("[data-deb]").forEach(b => b.onclick = () => run(b, async () => { await rpc("debitar_cheque_propio", { p_cheque: Number(b.dataset.deb) }); toast("Cheque propio debitado."); abrir(); }));
  $$("[data-rech]").forEach(b => b.onclick = () => run(b, async () => { const id = b.dataset.rech; const g = $("[data-gas=\"" + id + "\"]"); const r = await rpc("rechazar_cheque", { p_cheque: Number(id), p_motivo: $("[data-mot=\"" + id + "\"]").value, p_gastos_neto: g && g.value ? Number(N(g.value, "gastos")) : 0 }); toast("Cheque rechazado." + (r && r.nd_id ? " Se cargó la nota de débito al cliente." : "") + (r && r.aviso ? " " + r.aviso : "")); abrir(); }));
};

/* ===== BANCOS ===== */
let CTA_SEL = null;
VISTAS.bancos = async v => {
  await Promise.all([cargar("cuentas"), refrescarCaja()]); M = await rpc("panel_maestros");
  const ctas = D.cuentas.filter(c => c.estado === "activa"); if (!CTA_SEL && ctas[0]) CTA_SEL = ctas[0].id;
  const sel = D.cuentas.find(c => c.id === CTA_SEL);
  const medios = await tabla(sb.from("medios_pago").select("id, nombre, tipo, comision_pct, cuenta_id").eq("estado", "activo").lt("id", 8).order("id"));
  v.innerHTML = '<h2>Bancos y billeteras</h2><p class="lead">Saldo de cada cuenta según lo registrado. Conciliá cada movimiento contra el resumen del banco.</p>' +
    '<div class="grid"><div class="col"><div class="card"><h3>Nueva cuenta</h3><form id="fCta"><label>Nombre<input name="nom" required placeholder="Ej.: Macro cuenta corriente"></label><div class="row"><label>Tipo<select name="tipo"><option value="banco">Banco</option><option value="billetera">Billetera (MP)</option><option value="caja_fuerte">Caja fuerte</option></select></label><label>Banco<input name="banco"></label></div><label>CBU o alias<input name="cbu"></label><button class="b" type="submit">Crear cuenta</button></form></div>' +
    '<div class="card"><h3>Mover plata</h3><form id="fMover"><label>Operación<select name="op"><option value="dep">Depositar efectivo de la caja</option><option value="tra">Transferir entre cuentas</option><option value="egr">Gasto o comisión bancaria</option><option value="ing">Ingreso / ajuste</option></select></label><div class="row"><label>Cuenta<select name="a">' + opts(ctas, "id", "nombre", CTA_SEL) + '</select></label><label id="lDest" hidden>Hacia<select name="b">' + opts(ctas, "id", "nombre", "") + '</select></label></div><label>Importe<input name="imp" inputmode="decimal" required></label><label>Descripción<input name="desc"></label><button class="b p" type="submit">Registrar</button></form></div>' +
    '<div class="card"><h3>Medios de cobro</h3><p class="small muted" style="margin-top:0">Comisión que cobra cada medio (se registra como gasto al cobrar) y cuenta donde se acredita.</p><form id="fMed">' + medios.filter(m => m.tipo !== "efectivo" && m.tipo !== "cheque").map(m => '<div class="row"><label>' + esc(m.nombre) + ' · comisión %<input name="c' + m.id + '" inputmode="decimal" value="' + esc(m.comision_pct) + '"></label><label>Se acredita en<select name="k' + m.id + '">' + opts(ctas, "id", "nombre", m.cuenta_id, "—") + "</select></label></div>").join("") + '<button class="b" type="submit">Guardar medios</button></form></div></div>' +
    '<div class="col"><div class="card"><div class="tw"><table><thead><tr><th>Cuenta</th><th>Tipo</th><th class="n">Saldo</th><th></th></tr></thead><tbody>' + (D.cuentas.length ? D.cuentas.map(c => '<tr class="' + (c.id === CTA_SEL ? "sel" : "") + '"><td>' + esc(c.nombre) + '<div class="muted small">' + esc(c.banco || "") + "</div></td><td>" + esc(c.tipo) + '</td><td class="n"><b>' + money(c.saldo) + '</b></td><td><button class="b s" data-ver="' + c.id + '">Movimientos</button></td></tr>').join("") : '<tr><td colspan="4"><div class="empty">Creá la primera cuenta.</div></td></tr>') + "</tbody></table></div></div>" +
    (sel ? '<div class="card"><h3>Movimientos de ' + esc(sel.nombre) + '</h3><div id="movs" class="tw"></div></div>' : "") + "</div></div>";
  $$("[data-ver]").forEach(b => b.onclick = () => { CTA_SEL = Number(b.dataset.ver); abrir(); });
  onForm($("#fCta"), async f => { await tabla(sb.from("cuentas_fondos").insert({ nombre: f.get("nom"), tipo: f.get("tipo"), banco: f.get("banco") || null, cbu_alias: f.get("cbu") || null }).select("id").single()); toast("Cuenta creada."); abrir(); });
  const fm = $("#fMover"); fm.op.onchange = () => $("#lDest").hidden = fm.op.value !== "tra";
  onForm(fm, async f => {
    const op = f.get("op"), a = Number(f.get("a")), imp = N(f.get("imp")), desc = f.get("desc");
    if (!a) throw new Error("Elegí la cuenta.");
    if (op === "dep") await rpc("depositar_efectivo", { p_cuenta: a, p_importe: Number(imp), p_descripcion: desc || null });
    else if (op === "tra") await rpc("transferir_entre_cuentas", { p_desde: a, p_hasta: Number(f.get("b")), p_importe: Number(imp), p_descripcion: desc || null });
    else await rpc("movimiento_fondos_manual", { p_cuenta: a, p_tipo: op === "egr" ? "egreso" : "ingreso", p_importe: Number(imp), p_descripcion: desc || (op === "egr" ? "Gasto bancario" : "Ajuste") });
    toast("Movimiento registrado."); abrir();
  });
  onForm($("#fMed"), async f => { for (const m of medios.filter(m => m.tipo !== "efectivo" && m.tipo !== "cheque")) { const c = N(f.get("c" + m.id) || 0, "comisión"); const k = f.get("k" + m.id); await tabla(sb.from("medios_pago").update({ comision_pct: Number(c), cuenta_id: k ? Number(k) : null }).eq("id", m.id).select("id")); } M = await rpc("panel_maestros"); toast("Medios guardados."); abrir(); });
  if (sel) {
    const ms = await rpc("panel_movimientos_cuenta", { p_cuenta: sel.id });
    $("#movs").innerHTML = ms.length ? '<table><thead><tr><th>Fecha</th><th>Detalle</th><th class="n">Importe</th><th>Conciliado</th></tr></thead><tbody>' + ms.map(m => "<tr><td>" + fdt(m.fecha) + "</td><td>" + esc(m.descripcion) + '</td><td class="n" style="color:var(' + (m.tipo === "ingreso" ? "--ok" : "--bad") + ')">' + (m.tipo === "ingreso" ? "+" : "−") + money(m.importe) + '</td><td><input type="checkbox" data-conc="' + m.id + '" ' + (m.conciliado ? "checked" : "") + "></td></tr>").join("") + "</tbody></table>" : '<div class="empty">Sin movimientos.</div>';
    $$("[data-conc]").forEach(c => c.onchange = () => run(null, async () => { await rpc("conciliar_movimiento", { p_mov: Number(c.dataset.conc), p_conciliado: c.checked }); toast(c.checked ? "Conciliado." : "Marcado como no conciliado."); }));
  }
};

/* ---------- ingreso ---------- */
function mostrarLogin(msg) {
  $("#view").hidden = true; $("#tabs").innerHTML = ""; $("#usr").hidden = true; $("#cajaPill").hidden = true;
  $("#gate").hidden = false; $("#loginMsg").textContent = msg || ""; $("#loginMsg").hidden = !msg;
}
async function entrar() {
  M = await rpc("panel_maestros");
  const { data } = await sb.auth.getUser();
  USUARIO = data && data.user ? data.user.email : "";
  $("#usrNom").textContent = (M.es_dueno ? "Dueño" : "Operador") + " · " + USUARIO.replace("@pirotecniaboom.local", "");
  $("#gate").hidden = true; $("#view").hidden = false; $("#usr").hidden = false; $("#cajaPill").hidden = false;
  pintarTabs(); refrescarCaja(); abrir();
}
$("#fLogin").addEventListener("submit", ev => { ev.preventDefault(); run($("#fLogin button"), async () => {
  let u = $("#lUsr").value.trim().toLowerCase(); if (!u.includes("@")) u += "@pirotecniaboom.local";
  const { error } = await sb.auth.signInWithPassword({ email: u, password: $("#lPass").value });
  if (error) { mostrarLogin(/invalid/i.test(error.message) ? "Usuario o contraseña incorrectos." : errMsg(error)); return; }
  $("#lPass").value = ""; await entrar();
}); });
$("#salir").onclick = async () => { await sb.auth.signOut(); M = null; VTA.cart = []; VTA.pedido = null; mostrarLogin(); };
(async () => {
  try { const { data } = await sb.auth.getSession(); if (data && data.session) { await entrar(); return; } } catch (e) {}
  mostrarLogin();
})();
</script>
