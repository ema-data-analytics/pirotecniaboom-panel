<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pirotecnia Boom · Gestión</title>
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

</head>
<body>
<div id="cargando"></div>
<div id="login-wrap" style="display:none">
  <div class="login-box">
    <div class="login-logo"><img src="img/logo.png" alt="Pirotecnia Boom"><div class="login-logo-sub">Sistema de gestión</div></div>
    <div id="l-err" class="login-err"></div>
    <div class="fg"><label class="fl">Usuario</label><input id="l-user" class="fi" autocomplete="username" placeholder="Ej: dueño"></div>
    <div class="fg"><label class="fl">Contraseña</label><input id="l-pass" type="password" class="fi" autocomplete="current-password"></div>
    <button id="l-btn" class="btn btn-p btn-xl" style="width:100%;justify-content:center" onclick="entrar()"><i class="fas fa-right-to-bracket"></i> Ingresar</button>
    <div class="login-pie">EMA Data Analytics · Salta</div>
  </div>
</div>
<div id="app" style="display:none">
  <aside id="sidebar">
    <div class="sb-logo"><span class="lg"><img src="img/logo.png" alt="Pirotecnia Boom"></span><div class="sb-logo-sub">Gestión comercial</div></div>
    <div class="sb-user"><div class="sb-av" id="sb-av">?</div><div><div class="sb-uname" id="sb-uname"></div><div class="sb-urole" id="sb-urole"></div></div><button class="sb-logout" title="Salir" onclick="salir()"><i class="fas fa-right-from-bracket"></i></button></div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-footer"><a href="catalogo.html" target="_blank" style="color:var(--amarillo);font-size:11px;font-weight:700;text-decoration:none"><i class="fas fa-store"></i> Ver catálogo público</a><br>Pirotecnia Boom · v1.0 · EMA Data Analytics</div>
  </aside>
  <main id="main"></main>
</div>
<div id="modals"></div>
<div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="js/core.js?v=16"></script>
<script src="js/maestros.js?v=16"></script>
<script src="js/ventas.js?v=16"></script>
<script src="js/compras.js?v=16"></script>
<script src="js/caja.js?v=16"></script>
<script src="js/reportes.js?v=16"></script>
</body>
</html>
